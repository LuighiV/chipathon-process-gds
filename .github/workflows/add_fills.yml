# Workflow to add fills to GDS
name: Add fill to gds
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      tag_version:
        description: 'Version to process'
        default: 'v1'
        required: true
        type: string

jobs:
  add_fills:
    runs-on: ubuntu-latest
    # required to checkout in container
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    container:
      image: hpretl/iic-osic-tools:chipathon26
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Update the DRC deck and scripts
      run: |
        /bin/bash setup/path-drc.sh
        /bin/bash setup/path-scripts.sh

    # Runs a single command using the runners shell
    - name: Setting the version
      run: echo "Hello ${{ inputs.tag_version }}"
